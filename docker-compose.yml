name: good-deeds

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gooddeeds
      POSTGRES_PASSWORD: gooddeeds
      POSTGRES_DB: gooddeeds
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gooddeeds -d gooddeeds"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      GD_ENV: development
      GD_COOKIE_SECURE: "false"
      GD_DATABASE_URL: postgresql+psycopg://gooddeeds:gooddeeds@db:5432/gooddeeds
      GD_CORS_ORIGINS: '["http://localhost:5173"]'
      GD_WEB_BASE_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    command: ["procrastinate", "--app=app.core.jobs.job_app", "worker"]
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  db-data:
